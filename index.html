<!DOCTYPE html>
<html lang="en-us">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Othello DAA - Loading</title>
    <style>
        body {
            margin: 0;
            background: #1a1a2e;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Arial', sans-serif;
            color: white;
        }
        .loader {
            text-align: center;
        }
        .spinner {
            width: 60px;
            height: 60px;
            border: 5px solid rgba(255,255,255,0.2);
            border-top-color: #4ade80;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        h2 { margin: 0 0 8px; font-size: 1.4rem; }
        p { margin: 0; color: rgba(255,255,255,0.6); font-size: 0.9rem; }
    </style>
    <!-- Load COI Service Worker FIRST before anything else -->
    <script src="coi-serviceworker.min.js"></script>
    <script>
        // After the service worker registers, redirect to the actual game page
        // The service worker will add the required COOP/COEP headers on reload
        window.addEventListener('load', function() {
            if (typeof crossOriginIsolated !== 'undefined' && crossOriginIsolated) {
                // Already cross-origin isolated, go straight to game
                window.location.href = 'game.html';
            } else {
                // Service worker just registered, a reload is coming automatically
                // But if it doesn't happen in 2s, force it
                setTimeout(function() {
                    window.location.href = 'game.html';
                }, 1500);
            }
        });
    </script>
</head>
<body>
    <div class="loader">
        <div class="spinner"></div>
        <h2>Othello AI Game</h2>
        <p>Initializing secure context...</p>
    </div>
</body>
</html>
